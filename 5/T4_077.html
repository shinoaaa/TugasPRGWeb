<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penghitung Jumlah Klik</title>
</head>
<body>
    <h1>Aplikasi Penghitung Jumlah Klik - T4_077</h1>
    <button id="tombolKlik">Klik Saya!</button>
    <p>Jumlah klik yang telah dilakukan: <span id="tampilJumlah" style="font-weight: bold;">0</span></p>

    <script>
        let jumlahKlik = 0;
        const tombol = document.getElementById('tombolKlik');
        const tampilJumlah = document.getElementById('tampilJumlah');

        tombol.addEventListener('click', () => {
            jumlahKlik++;
            tampilJumlah.textContent = jumlahKlik;
        });
    </script>
</body>
</html>
