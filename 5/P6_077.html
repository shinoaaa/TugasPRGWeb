<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Tugas</title>
    <style>
        .completed {
            text-decoration: line-through;
            color: gray;
        }
        button {
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <h1>Daftar Tugas - P6_077</h1>
    <input type="text" id="inputTugas" placeholder="Masukkan tugas">
    <button onclick="tambahTugas()">Tambah Tugas</button>
    <button onclick="tampilkanTugas()">Tampilkan Daftar Tugas</button>

    <ul id="listTugas" style="display: none; list-style-type: none; padding-left: 0;"></ul>

    <script>
        let daftarTugas = [];

        function tambahTugas() {
            const input = document.getElementById('inputTugas');
            const tugasText = input.value.trim();

            if (tugasText) {
                daftarTugas.push({ text: tugasText, completed: false });
                input.value = '';
            } else {
                alert("Masukkan tugas yang valid.");
            }
        }

        function tampilkanTugas() {
            const list = document.getElementById('listTugas');
            list.innerHTML = '';

            if (daftarTugas.length === 0) {
                list.innerHTML = '<li>Tidak ada tugas.</li>';
            } else {
                daftarTugas.forEach((tugas, index) => {
                    const li = document.createElement('li');
                    
                    const checkbox = document.createElement('input');
                    checkbox.type = 'checkbox';
                    checkbox.checked = tugas.completed;
                    checkbox.onchange = () => tandaiSelesai(index);

                    const span = document.createElement('span');
                    span.textContent = " " + tugas.text;
                    if (tugas.completed) {
                        span.classList.add('completed');
                    }

                    const btnHapus = document.createElement('button');
                    btnHapus.textContent = 'Hapus';
                    btnHapus.onclick = () => hapusTugas(index);

                    li.appendChild(checkbox);
                    li.appendChild(span);
                    li.appendChild(btnHapus);

                    list.appendChild(li);
                });
            }
            list.style.display = 'block';
        }

        function hapusTugas(indeks) {
            if (indeks >= 0 && indeks < daftarTugas.length) {
                daftarTugas.splice(indeks, 1);
                tampilkanTugas();
            }
        }

        function tandaiSelesai(index) {
            daftarTugas[index].completed = !daftarTugas[index].completed;
            tampilkanTugas();
        }
    </script>
</body>
</html>
