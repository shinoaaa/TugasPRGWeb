<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Data Transaksi</title>
        <!-- Bootstrap CSS -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
        <style>
            body {
                background-color: #f8f9fa;
                font-family: 'Tahoma', sans-serif;
                padding: 20px;
            }
            .container {
                margin-top: 30px;
            }
            .table-container {
                box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
                border-radius: 10px;
                background-color: #ffffff;
                padding: 20px;
            }
            h1 {
                text-align: center;
                margin-bottom: 30px;
            }
            .table thead th {
                background-color: #343a40;
                color: #ffffff;
            }
            .form-container {
                box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
                border-radius: 10px;
                background-color: white;
                padding: 20px;
                margin-top: 20px;
                display: none;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <button id="addDataBtn" class="btn btn-primary mb-3">+ Tambah Transaksi</button>
            <div class="table-container">
                <h1>Daftar Transaksi</h1>
                <table id="transaksi-table" class="table table-bordered table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nama Produk</th>
                            <th>Jumlah</th>
                            <th>Harga Satuan</th>
                            <th>Total Harga</th>
                            <th>Tanggal</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="7" class="text-center">Data Transaksi akan muncul di sini...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="form-container" id="formContainer">
                <h3 id="formTitle">Tambah Transaksi Baru</h3>
                <form id="transaksiForm">
                    <div class="mb-3">
                        <label>Nama Produk</label>
                        <input type="text" class="form-control" id="namaProduk" required>
                    </div>
                    <div class="mb-3">
                        <label>Jumlah</label>
                        <input type="number" class="form-control" id="jumlah" required>
                    </div>
                    <div class="mb-3">
                        <label>Harga Satuan</label>
                        <input type="number" class="form-control" id="hargaSatuan" required>
                    </div>
                    <div class="mb-3">
                        <label>Tanggal</label>
                        <input type="date" class="form-control" id="tanggal" required>
                    </div>
                    <button type="submit" class="btn btn-success" id="submitBtn">Submit</button>
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                </form>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            let currentEditId = null;

            const readUrl   = 'https://api.roniprsty.com/transaksi/read.php';
            const createUrl = 'https://api.roniprsty.com/transaksi/create.php';
            const updateUrl = 'https://api.roniprsty.com/transaksi/update.php';

            document.getElementById('addDataBtn').addEventListener('click', () => {
                currentEditId = null;
                document.getElementById('formTitle').textContent = 'Tambah Transaksi Baru';
                document.getElementById('submitBtn').textContent = 'Submit';
                document.getElementById('transaksiForm').reset();
                document.getElementById('formContainer').style.display = 'block';
            });

            document.getElementById('cancelBtn').addEventListener('click', () => {
                document.getElementById('formContainer').style.display = 'none';
            });

            async function getTransaksi() {
                try {
                    let respons = await fetch(readUrl);
                    if (!respons.ok) throw new Error(`Http error! status: ${respons.status}`);
                    let data = await respons.json();

                    let tableBody = document.querySelector('#transaksi-table tbody');
                    tableBody.innerHTML = '';

                    if (!data || data.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="7" class="text-center">Belum ada data transaksi.</td></tr>';
                        return;
                    }

                    data.forEach(item => {
                        let row = `
                            <tr>
                                <td>${item.id}</td>
                                <td>${item.nama_produk}</td>
                                <td>${item.jumlah}</td>
                                <td>Rp ${Number(item.harga_satuan).toLocaleString('id-ID')}</td>
                                <td>Rp ${Number(item.total_harga).toLocaleString('id-ID')}</td>
                                <td>${item.tanggal}</td>
                                <td>
                                    <button class="btn btn-warning btn-sm" onclick="editTransaksi(${item.id}, '${item.nama_produk}', ${item.jumlah}, ${item.harga_satuan}, '${item.tanggal}')">Edit</button>
                                </td>
                            </tr>
                        `;
                        tableBody.innerHTML += row;
                    });
                } catch (error) {
                    console.error("Gagal mengambil data transaksi: ", error);
                    document.querySelector('#transaksi-table tbody').innerHTML = '<tr><td colspan="7" class="text-center text-danger">Gagal memuat data. Periksa koneksi atau API.</td></tr>';
                }
            }

            getTransaksi();
            document.getElementById('transaksiForm').addEventListener('submit', async function(e) {
                e.preventDefault();

                const namaProduk  = document.getElementById('namaProduk').value;
                const jumlah      = document.getElementById('jumlah').value;
                const hargaSatuan = document.getElementById('hargaSatuan').value;
                const tanggal     = document.getElementById('tanggal').value;
                const totalHarga  = parseInt(jumlah) * parseInt(hargaSatuan);

                const transaksiData = {
                    "nama_produk": namaProduk,
                    "jumlah": jumlah,
                    "harga_satuan": hargaSatuan,
                    "total_harga": totalHarga,
                    "tanggal": tanggal
                };

                if (currentEditId !== null) {
                    transaksiData["id"] = currentEditId;
                }

                const targetUrl  = currentEditId !== null ? updateUrl : createUrl;
                const successMsg = currentEditId !== null ? 'Transaksi berhasil diupdate' : 'Transaksi berhasil ditambahkan';

                try {
                    let response = await fetch(targetUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(transaksiData)
                    });

                    if (!response.ok) throw new Error(`HTTP error! status ${response.status}`);
                    alert(successMsg);
                    document.getElementById('formContainer').style.display = 'none';
                    currentEditId = null;
                    getTransaksi();
                } catch (error) {
                    console.log('Gagal menyimpan transaksi: ', error);
                    alert('Gagal menyimpan transaksi');
                }
            });

            function editTransaksi(id, nama, jumlah, hargaSatuan, tanggal) {
                currentEditId = id;
                document.getElementById('formTitle').textContent = 'Edit Transaksi';
                document.getElementById('submitBtn').textContent = 'Update';
                document.getElementById('namaProduk').value  = nama;
                document.getElementById('jumlah').value      = jumlah;
                document.getElementById('hargaSatuan').value = hargaSatuan;
                document.getElementById('tanggal').value     = tanggal;
                document.getElementById('formContainer').style.display = 'block';
            }
        </script>
    </body>
</html>
