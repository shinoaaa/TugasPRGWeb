<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Produk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .table-container {
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            background-color:#f8f9fa;
            padding: 20px;
        }

        h1 {
            text-align : center;
            margin-bottom: 30px;
        }

        .table thead th {
            background-color : #343a40;
            color: white;

        }

        .form-container {
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            background-color: #ffffff;
            padding: 20px;
            margin-top: 20px;
            display: none;

        }
    </style>
</head>
<body>
    
    <div class="container">
        <div class="table-container">
            <h1>Daftar Produk - P7_077</h1>
            <button id="addDataBtn" class="btn btn-primary mb-3">+ Add Transaksi</button>
            <table id="product-table" class="table table-bordered table-hover">
                <thead>
                    <tr>
                        <th>ID Transaksi</th>
                        <th>Tanggal Transaksi</th>
                        <th>ID Produk</th>
                        <th>Jumlah</th>
                        <th>Total Harga</th>
                        <th>Status Transaksi</th>
                        <th>Aksi</th>
                        
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td colspan="7" class="text-center">Data Transaksi akan muncul di sini....</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="form-container" id="formContainer">
            <h3 id="formTitle">Tambah Transaksi Baru</h3> 
            <form id="addProductForm">
                <div class="mb-3">
                    <label class="form-label">ID Produk</label>
                    <input type="number" class="form-control" id="idProduk" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Jumlah Produk</label>
                    <input type="number" class="form-control" id="jumlahProduk" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Status Transaksi</label>
                    <select class="form-control" id="statusTransaksi" required>
                        <option value="Pending">Pending</option>
                        <option value="Selesai">Selesai</option>
                        <option value="Batal">Batal</option>
                        <option value="Proses">Proses</option>
                    </select>
                </div>
               <button type="submit" class="btn btn-success" id="submitBtn">Submit</button>
               <button type="button" id="cancelBtn" class="btn btn-secondary">Cancel</button>
            </form>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
        <script>

            const url = 'http://api.melangkah.my.id/transaksi/read.php';
            const createUrl = 'http://api.melangkah.my.id/transaksi/create.php';
            const updateUrl = 'http://api.melangkah.my.id/transaksi/update.php';
            

            async function getProducts() {
                try {
                    let response = await fetch(url);

                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    let products = await response.json();

                    let tableBody = document.querySelector('#product-table tbody');
                    tableBody.innerHTML = '';

                    products.forEach(product => {
                        let row = `
                            <tr>
                                <td>${product.id_transaksi}</td>
                                <td>${product.tanggal_transaksi}</td>
                                <td>${product.id_produk}</td>
                                <td>${product.jumlah}</td>
                                <td>Rp${product.total_harga}</td>
                                <td>${product.status_transaksi}</td>
                               
                                <td>
                                    <!-- Perhatikan tanda kutip tunggal di dalam kurung editProduct -->
                                    <button class="btn btn-warning btn-sm" onclick="editProduct('${product.id_transaksi}', '${product.id_produk}', '${product.jumlah}', '${product.status_transaksi}')">Edit</button>
                                </td>
                            </tr>`;

                        tableBody.innerHTML += row;
                    });
                } catch (error) {
                    console.error("Gagal mengambil data produk:", error);
                    document.querySelector('#product-table tbody').innerHTML = `<tr><td colspan="7" class="text-center">Tidak dapat mengambil data produk.</td></tr>`;
                }
            }
            
            document.getElementById('addDataBtn').addEventListener('click', function() {
                document.getElementById('formTitle').textContent = 'Tambah Transaksi Baru';
                document.getElementById('submitBtn').textContent = 'Submit';
                document.getElementById('addProductForm').reset(); 
                delete document.getElementById('addProductForm').dataset.id;

                document.getElementById('idProduk').readOnly = false;
                document.getElementById('jumlahProduk').readOnly = false;
                document.getElementById('formContainer').style.display = 'block';
            });
            
            document.getElementById('cancelBtn').addEventListener('click', function() {
                document.getElementById('formContainer').style.display = 'none';
            });

           document.getElementById('addProductForm').addEventListener('submit', async function(event) {
                event.preventDefault();
                const id = this.dataset.id; 
                
                try {
                    if (id) {
                        const updateData = {
                            id_transaksi: id,
                            status_transaksi: document.getElementById('statusTransaksi').value
                        };
                        let response = await fetch(updateUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(updateData)
                        });
                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                        alert('Status transaksi berhasil diperbarui!');
                    } else {
                        const createData = {
                            id_produk: document.getElementById('idProduk').value,
                            jumlah: document.getElementById('jumlahProduk').value
                        };
                        let response = await fetch(createUrl, {
                            method : 'POST',
                            headers : { 'Content-Type': 'application/json' },
                            body : JSON.stringify(createData)
                        });
                        if (!response.ok) throw new Error(`HTTP error ! status: ${response.status}`);
                        alert('Transaksi berhasil ditambahkan!');
                    }

                    getProducts();
                    document.getElementById('formContainer').style.display = 'none'; 
                } catch (error) {
                    console.error("Gagal memproses transaksi:", error);
                    alert('Gagal memproses transaksi. Silakan coba lagi.');
                }
            });
        
           
           function editProduct(id_transaksi, id_produk, jumlah, status) {
                document.getElementById('formTitle').textContent = 'Update Status Transaksi';
                document.getElementById('submitBtn').textContent = 'Update';
                document.getElementById('addProductForm').dataset.id = id_transaksi;

                document.getElementById('idProduk').value = id_produk;
                document.getElementById('jumlahProduk').value = jumlah;
                document.getElementById('statusTransaksi').value = status;
                
                document.getElementById('formContainer').style.display = 'block';

                document.getElementById('idProduk').readOnly = true;
                document.getElementById('jumlahProduk').readOnly = true;
            }
            
            getProducts();
        </script>

    </div>
</body>
</html>
