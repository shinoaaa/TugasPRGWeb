<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tampilan template (sudah termasuk Bootstrap) -->
    <link href="css/sb-admin-2.min.css" rel="stylesheet">

    <style>
        .form-container{
            display: none;
        }
    </style>
</head>
<body id="page-top">
    <div id="wrapper">

        <!-- Sidebar -->
        <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">

            <!-- Sidebar - Brand -->
            <a class="sidebar-brand d-flex align-items-center justify-content-center" href="peminjaman.html">
                <div class="sidebar-brand-icon rotate-n-15">
                    <i class="fas fa-gamepad"></i>
                </div>
                <div class="sidebar-brand-text mx-3">Nabil <sup>GAMING</sup></div>
            </a>

            <!-- Divider -->
            <hr class="sidebar-divider">

            <!-- Heading -->
            <div class="sidebar-heading">
                Master Data
            </div>

            <li class="nav-item active">
                <a class="nav-link" href="asset.html">
                    <i class="fas fa-fw fa-toolbox"></i>
                    <span>Master Data Asset</span></a>
            </li>

            <li class="nav-item">
                <a class="nav-link" href="mahasiswa.html">
                    <i class="fas fa-fw fa-user-graduate"></i>
                    <span>Master Data Mahasiswa</span></a>
            </li>

            <!-- Divider -->
            <hr class="sidebar-divider">

            <!-- Heading -->
            <div class="sidebar-heading">
                Transaksi
            </div>

            <li class="nav-item">
                <a class="nav-link" href="peminjaman.html">
                    <i class="fas fa-fw fa-hand-holding"></i>
                    <span>Transaksi Peminjaman</span></a>
            </li>

            <!-- Divider -->
            <hr class="sidebar-divider d-none d-md-block">

            <!-- Sidebar Toggler (Sidebar) -->
            <div class="text-center d-none d-md-inline">
                <button class="rounded-circle border-0" id="sidebarToggle"></button>
            </div>

        </ul>
        <!-- End of Sidebar -->

        <div id="content-wrapper" class="d-flex flex-column">
            <div id="content">

                <!-- Topbar (tombol menu buat layar kecil) -->
                <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">
                    <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
                        <i class="fa fa-bars"></i>
                    </button>
                    <span class="font-weight-bold text-gray-800">Master Data Asset</span>
                </nav>

                <div class="container-fluid">

                    <div class="d-sm-flex align-items-center justify-content-between mb-4">
                        <h1 class="h3 mb-0 text-gray-800 font-weight-bold">Data Asset</h1>
                        <button class="btn btn-success px-4" id="addAsset">
                            <i class="fas fa-plus fa-sm mr-1"></i> Tambah Asset
                        </button>
                    </div>

                    <!-- Form tambah / edit -->
                    <div class="card shadow mb-4 form-container" id="form-container">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary form-title">Form Tambah Asset</h6>
                        </div>
                        <div class="card-body">
                            <form id="addProductForm">
                                <div class="form-row">
                                    <div class="form-group col-md-6">
                                        <label for="namaAsset">Nama Asset</label>
                                        <input type="text" id="namaAsset" class="form-control" required>
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="kategoriAsset">Kategori</label>
                                        <select id="kategoriAsset" class="form-control" required>
                                            <option value="Elektronik">Elektronik</option>
                                            <option value="Kabel">Kabel</option>
                                            <option value="ATK">ATK</option>
                                        </select>
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="jumlahAsset">Jumlah Asset</label>
                                        <input type="number" id="jumlahAsset" class="form-control" required>
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="kondisiAsset">Kondisi Asset</label>
                                        <select id="kondisiAsset" class="form-control" required>
                                            <option value="Baik">Baik</option>
                                            <option value="Rusak Ringan">Rusak Ringan</option>
                                            <option value="Rusak Hebat">Rusak Hebat</option>
                                        </select>
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="lokasiPeminjaman">Lokasi Peminjaman</label>
                                        <input type="text" id="lokasiPeminjaman" class="form-control" required>
                                    </div>
                                    <div class="form-group col-md-6">
                                        <label for="statusAsset">Status Asset</label>
                                        <select id="statusAsset" class="form-control" required>
                                            <option value="Tersedia">Tersedia</option>
                                            <option value="Dipinjam">Dipinjam</option>
                                        </select>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary">Submit</button>
                                <button type="reset" class="btn btn-secondary">Cancel</button>
                            </form>
                        </div>
                    </div>

                    <!-- Tabel -->
                    <div class="card shadow mb-4">
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-striped table-bordered">
                                    <thead class="thead-dark">
                                        <tr>
                                            <th>No</th>
                                            <th>Nama Asset</th>
                                            <th>Kategori</th>
                                            <th>Jumlah</th>
                                            <th>Kondisi</th>
                                            <th>Lokasi</th>
                                            <th>Status</th>
                                            <th>Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody id="asset-data">
                                        <tr>
                                            <td colspan="8">
                                                Bntr lagi ngambil data...
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

            <footer class="sticky-footer bg-white">
                <div class="container my-auto">
                    <div class="copyright text-center my-auto">
                        <span>Nabil Gaming &copy; 2026</span>
                    </div>
                </div>
            </footer>
        </div>
    </div>

    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fas fa-angle-up"></i>
    </a>

    <script>
        const URL = 'https://api.melangkah.my.id';
        const formAsset = document.getElementById('form-container');
        const formTitle = formAsset.querySelector('.form-title');
        const addProductForm = document.getElementById('addProductForm');
        const addButton = document.getElementById('addAsset');
        const cancelButton = formAsset.querySelector('.btn.btn-secondary')
        let isEdit = 0

        async function getAsset(){
            let number = 1;

            try {
                const response = await fetch(`${URL}/asset/read.php`);
                if(!response.ok) throw new Error(`Error: ${response.status}`)

                let asset = await response.json();
                console.log(asset);

                let table_asset = document.getElementById('asset-data');
                table_asset.innerHTML = ' '

                asset.forEach(element => {
                    let baris = `
                        <tr>
                            <td>${number++}</td>
                            <td>${element.nama_asset}</td>
                            <td>${element.kategori}</td>
                            <td>${element.jumlah}</td>
                            <td>${element.kondisi}</td>
                            <td>${element.lokasi}</td>
                            <td>${element.status}</td>
                            <td class="text-nowrap">
                                <button class="btn btn-warning btn-sm" onclick="editAsset(${element.id})">Edit</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteAsset(${element.id})">Hapus</button>
                            </td>
                        </tr>
                    `

                    table_asset.innerHTML += baris;
                });

            } catch (error) {
                console.error("Gagal mengambil data produk:", error);
                document.getElementById("asset-data").innerHTML = `<tr><td colspan="8">Gagal ambil data, cek console</td></tr>`
            }
        }

        addButton.addEventListener('click', ()=>{
            isEdit = 0
            formTitle.textContent = 'Form Tambah Asset'
            formAsset.style.display = 'block'
            formAsset.scrollIntoView({ behavior: 'smooth' })
            addProductForm.reset()
        })

        cancelButton.addEventListener('click', ()=>{
            formAsset.style.display = 'none'
            isEdit = 0
        })

        addProductForm.addEventListener('submit', submitAsset);

        async function submitAsset(e){
            e.preventDefault();

            const namaAsset = document.getElementById('namaAsset').value
            const kategoriAsset = document.getElementById('kategoriAsset').value
            const jumlahAsset =  document.getElementById('jumlahAsset').value
            const kondisiAsset = document.getElementById('kondisiAsset').value
            const lokasiPeminjaman =  document.getElementById('lokasiPeminjaman').value
            const statusAsset = document.getElementById('statusAsset').value

            const isiForm = {
                nama_asset: namaAsset,
                kategori: kategoriAsset,
                jumlah: jumlahAsset,
                kondisi: kondisiAsset,
                lokasi: lokasiPeminjaman,
                status: statusAsset
            }

            try {
                if(isEdit){
                    isiForm.id = isEdit;
                    const response = await fetch(`${URL}/asset/update.php`,{
                        method: "POST",
                        headers: {
                            "Content-Type" : "application/json"
                        },
                        body: JSON.stringify(isiForm)
                    }
                )
                if(!response.ok) throw new Error(`Http error: ${response.status}`);
                alert("Data Berhasil Diedit");
                formAsset.style.display = 'none'
                isEdit = 0;

                }else{

                    const response = await fetch(`${URL}/asset/create.php`,{
                        method: "POST",
                        headers: {
                            "Content-Type" : "application/json"
                        },
                        body: JSON.stringify(isiForm)
                    }
                )
                if(!response.ok) throw new Error(`Http error: ${response.status}`);

                alert("Data Berhasil Disimpan");
                formAsset.style.display = 'none'
            }
            getAsset();
            } catch (error) {
                console.error("error mas:", error)
                alert("error, cek console cepat")
            }
        }

        async function editAsset(id) {
            try {
                const response = await fetch(`${URL}/asset/detail.php?id=${id}`)
                if(!response.ok) throw new Error(`Error pakcik: ${response.status}`)

                let product = await response.json()

                if(!product){
                    alert("gada datanya rek")
                    return;
                }

                formTitle.textContent = 'Form Edit Asset'
                formAsset.style.display = 'block'
                formAsset.scrollIntoView({ behavior: 'smooth' })

                document.getElementById('namaAsset').value = product.nama_asset
                document.getElementById('kategoriAsset').value = product.kategori
                document.getElementById('jumlahAsset').value = product.jumlah
                document.getElementById('kondisiAsset').value = product.kondisi
                document.getElementById('lokasiPeminjaman').value = product.lokasi
                document.getElementById('statusAsset').value = product.status

                isEdit = id

            } catch (error) {
                console.error("Katanya gini errornya", error)
            }


        }

        async function deleteAsset(id) {
            if(!confirm("Yakin mau hapus data ini?")) return;

            try {
                const response = await fetch(`${URL}/asset/delete.php?id=${id}`,{
                    method : "DELETE"
                })
                if(!response.ok) throw new Error(`Error pakcik: ${response.status}`)

                alert("data berhasil dihapus")
                getAsset();

            } catch (error) {
                console.error("Katanya gini errornya", error)
            }
        }

        getAsset();
    </script>

    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
