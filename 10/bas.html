<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            background-color: #f5f6fa;
        }

        .sidebar {
            min-height: 100vh;
        }

        .card {
            border: none;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
        }

        .chart-container {
            height: 300px;
        }

        .height-min{
            min-height: 125px;
        }
    </style>
</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar bg-dark">
                safsdfa
            </div>
            <div class="col-md-10 d-flex justify-content-center align-items-center">
                <div class="container" style="min-height: 95vh;">
                    <div class="row mb-5">
                        <div class="col-md-3">
                            <div class="card p-3 height-min" style="background-color: aqua;"></div>
                        </div>
                        <div class="col-md-3  height-min">
                            <div class="card p-3 height-min" style="background-color: aqua;"></div>
                        </div>
                        <div class="col-md-3">
                            <div class="card p-3 height-min">
                                <canvas id="browserChart"></canvas>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card p-3 height-min" style="background-color: aqua;"></div>
                        </div>
                    </div>
                    <div class="row" style="height: 400px; background-color: red;"></div>
                </div>
            </div>
        </div>
    </div>


<!-- ================= CHART JS ================= -->

<script>

    new Chart(
        document.getElementById('linecuy'),
        {
            type: 'line',
            data: {
                labels: [
                    'Ikan',
                    'Sapi',
                    'Unta',
                    'Kerbau'
                ],
                datasets: [{
                    data:[
                        200,120,40,20,12
                    ]
                }]
            }
        }
    )

    // LINE / AREA CHART
    const salesChart = new Chart(
        document.getElementById('salesChart'),
        {
            type: 'line',

            data: {
                labels: [
                    'Jan',
                    'Feb',
                    'Mar',
                    'Apr',
                    'May',
                    'Jun',
                    'Jul',
                ],

                datasets: [{
                    label: 'Sales',

                    data: [
                        120,
                        190,
                        150,
                        250,
                        220,
                        300,
                        350
                    ],

                    fill: true,

                    tension: 0.4
                }]
            }
        }
    );


    // DONUT CHART
    const browserChart = new Chart(
        document.getElementById('browserChart'),
        {
            type: 'doughnut',

            data: {
                labels: [
                    'Chrome',
                    'Firefox',
                    'Edge',
                    'Safari'
                ],

                datasets: [{
                    data: [
                        60,
                        20,
                        15,
                        5
                    ]
                }]
            }
        }
    );


    // BAR CHART
    const orderChart = new Chart(
        document.getElementById('orderChart'),
        {
            type: 'bar',

            data: {
                labels: [
                    'Jan',
                    'Feb',
                    'Mar',
                    'Apr',
                    'May',
                    'Jun'
                ],

                datasets: [{
                    label: 'Orders',

                    data: [
                        30,
                        45,
                        35,
                        60,
                        50,
                        80
                    ]
                }]
            }
        }
    );

</script>


</body>
</html>
